name: Daily Playwright Auto Sync

on:
  schedule:
    - cron: "0 7 * * *" # 10:00 AM Beirut time during summer = 07:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm i -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Run website auto sync
        run: npx playwright test tests/auto-sync.spec.ts --project=chromium
        env:
          AUTO_SYNC_URL: ${{ secrets.AUTO_SYNC_URL }}
          AUTO_SYNC_PATH: ${{ secrets.AUTO_SYNC_PATH }}
          AUTO_SYNC_BUTTON_TEXT: ${{ secrets.AUTO_SYNC_BUTTON_TEXT }}
          AUTO_SYNC_SUCCESS_TEXT: ${{ secrets.AUTO_SYNC_SUCCESS_TEXT }}