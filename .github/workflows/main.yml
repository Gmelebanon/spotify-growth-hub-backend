name: Daily Data Sync

on:
  schedule:
    # GitHub cron uses UTC.
    # 07:00 UTC = 10:00 Beirut during summer.
    # 15:00 UTC = 18:00 Beirut during summer.
    - cron: "0 7,15 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      BACKEND_BASE_URL: https://spotify-growth-hub-backend.onrender.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run sync
        run: python scripts/sync.py
